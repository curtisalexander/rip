name: Windows paired benchmark

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit or ref (built on the same runner)
        required: true
        type: string
      storage:
        description: Fixture volume (checkout or Windows temporary directory)
        type: choice
        options: [checkout, temp]
        default: checkout
        required: true
      iterations:
        description: Timed pairs per workload (positive integer)
        type: number
        default: 15
        required: true
      threads:
        description: Worker count (nonnegative integer; 0 uses rip default)
        type: number
        default: 4
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shape: [flat, wide, dirs, deep, readonly]
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record environment (do not change Defender)
        shell: pwsh
        run: |
          $defender = Get-MpComputerStatus
          @{
            baseline = (git -C baseline rev-parse HEAD)
            candidate = (git -C candidate rev-parse HEAD)
            rust = (rustc -Vv)
            os = (Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber, CsProcessors)
            volumes = (Get-Volume | Select-Object DriveLetter, FileSystem, Size)
            disks = (Get-Disk | Select-Object Number, FriendlyName, BusType)
            defender = ($defender | Select-Object AMProductVersion, AntivirusSignatureVersion, RealTimeProtectionEnabled)
          } | ConvertTo-Json -Depth 5 | Tee-Object -FilePath environment.json
          if ($defender.RealTimeProtectionEnabled -ne $false) {
            throw 'This benchmark requires Defender real-time protection off; settings are not changed.'
          }
      - name: Check candidate
        working-directory: candidate
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build baseline
        working-directory: baseline
        run: cargo build --release --locked
      - name: Build candidate
        working-directory: candidate
        run: cargo build --release --locked
      - name: Paired comparison
        env:
          BENCH_STORAGE: ${{ inputs.storage }}
          BENCH_ITERATIONS: ${{ inputs.iterations }}
          BENCH_THREADS: ${{ inputs.threads }}
          BENCH_SHAPE: ${{ matrix.shape }}
        run: |
          $workRoot = switch ($env:BENCH_STORAGE) {
            'checkout' { 'candidate/target' }
            'temp' { [System.IO.Path]::GetTempPath() }
            default { throw 'Unknown fixture storage selection' }
          }
          python candidate/bench/compare.py --baseline baseline/target/release/rip.exe --candidate candidate/target/release/rip.exe --shapes "$env:BENCH_SHAPE" --entries 10000 --iterations "$env:BENCH_ITERATIONS" --threads "$env:BENCH_THREADS" --work-root "$workRoot" --settle-seconds 1 --output comparison.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-${{ matrix.shape }}
          path: |
            comparison.json
            environment.json
