name: Windows performance experiment

on:
  push:
    branches: [perf/windows-delete]
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit or ref (built on the same runner)
        required: true
        default: '68ef64b3b7261d0e136a6cb37ffece44d74d63d5'

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shape: [flat, wide, dirs, deep, readonly]
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline || '68ef64b3b7261d0e136a6cb37ffece44d74d63d5' }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record environment (do not change Defender)
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, CsProcessors | ConvertTo-Json -Depth 3
          Get-Volume | Select-Object DriveLetter, FileSystem, SizeRemaining, Size | ConvertTo-Json
          Get-MpComputerStatus | Select-Object AMProductVersion, AntivirusSignatureVersion, RealTimeProtectionEnabled | ConvertTo-Json
          rustc -Vv
          git -C baseline rev-parse HEAD
          git -C candidate rev-parse HEAD
      - name: Check candidate
        working-directory: candidate
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build baseline
        working-directory: baseline
        run: cargo build --release --locked
      - name: Build candidate
        working-directory: candidate
        run: cargo build --release --locked
      - name: Paired comparison
        run: >-
          python candidate/bench/compare.py
          --baseline baseline/target/release/rip.exe
          --candidate candidate/target/release/rip.exe
          --shapes ${{ matrix.shape }}
          --entries 10000 --iterations 11 --threads 4
          --settle-seconds 1
          --output comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-${{ matrix.shape }}
          path: comparison.json
