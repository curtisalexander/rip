name: Windows CPU and file IO profile

on:
  push:
    branches: [perf/windows-delete]
    paths:
      - 'bench/profile/**'
      - '.github/workflows/profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shape: [wide]
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Record environment and require inactive Defender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force profile-output | Out-Null
          $defender = Get-MpComputerStatus
          @{
            revision = (git rev-parse HEAD)
            rust = (rustc -Vv)
            os = (Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber, CsProcessors)
            volumes = (Get-Volume | Select-Object DriveLetter, FileSystem, Size)
            disks = (Get-Disk | Select-Object Number, FriendlyName, BusType)
            defender = ($defender | Select-Object AMProductVersion, AntivirusSignatureVersion, RealTimeProtectionEnabled)
            rustReleaseDebug = $env:CARGO_PROFILE_RELEASE_DEBUG
          } | ConvertTo-Json -Depth 5 | Set-Content profile-output/environment.json
          if ($defender.RealTimeProtectionEnabled) {
            throw 'Defender is active; refusing to change security settings for this profile.'
          }
      - name: Build optimized binary with symbols and trace analyzer
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build bench/profile/TraceSummary.csproj --artifacts-path target/profile-build -o target/profile-analyzer -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Obtain pinned Microsoft PerfView
        run: |
          New-Item -ItemType Directory -Force target/profile-tools | Out-Null
          Invoke-WebRequest https://github.com/microsoft/perfview/releases/download/v3.2.6/PerfView.exe -OutFile target/profile-tools/PerfView.exe
          Get-FileHash target/profile-tools/PerfView.exe | Format-List
      - name: Capture deletion (fixture generation excluded)
        run: >-
          python bench/profile/collect.py
          --rip target/release/rip.exe
          --perfview target/profile-tools/PerfView.exe
          --output profile-output
          --shape ${{ matrix.shape }} --entries 20000 --threads 4
      - name: Resolve symbols and summarize ETW
        run: |
          dotnet target/profile-analyzer/TraceSummary.dll profile-output/rip.etl target/release profile-output/summary.json 2> profile-output/analysis.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve executable and matching symbols
        if: always()
        run: |
          Copy-Item target/release/rip.exe profile-output -ErrorAction Continue
          Copy-Item target/release/rip.pdb profile-output -ErrorAction Continue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-${{ matrix.shape }}
          retention-days: 14
          path: |
            profile-output/*.json
            profile-output/*.etl
            profile-output/*.log
            profile-output/*.txt
            profile-output/rip.exe
            profile-output/rip.pdb
